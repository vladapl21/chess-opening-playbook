/* board colours (Settings): each palette has its own light and dark values */
:root[data-board="wood"]{--sq-light:#F0DDBD;--sq-dark:#B98B63}

:root[data-board="slate"]{--sq-light:#E7E8EA;--sq-dark:#8E969E}
:root[data-board="plum"]{--sq-light:#ECE5F3;--sq-dark:#9C88BF}

  :root[data-board="wood"]:not([data-theme="light"]){--sq-light:#DCC7A4;--sq-dark:#9C7551}

  :root[data-board="slate"]:not([data-theme="light"]){--sq-light:#CDD0D4;--sq-dark:#707982}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:3px}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pico.b{filter:var(--pico-b)}

/* header: one grid, so nothing can sit on top of anything else. Row one: the brand on the left, the level, the streak,
   settings and the account on the right. Row two: the sections, underlined on the header's bottom line. Narrower: the
   right-hand buttons drop their words. There is no White | Black switch: both books are in every tab. */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand util" "tabs tabs";align-items:center;gap:14px 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brandrow{grid-area:brand;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left;flex:none}
.brand .mark{width:40px;height:40px;border-radius:4px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:30px;height:30px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.005em;white-space:nowrap}
.wordmark em{font-style:italic;font-weight:600;color:var(--accent)}
.corner{grid-area:util;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.tabs{grid-area:tabs;display:flex;gap:2px;margin-bottom:-1px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;border:0;background:none;padding:9px 14px 12px;border-radius:0;font-weight:650;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tabs button .sm{display:none}
.tabs button .todo{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--flame);color:var(--flame-ink);font:800 11.5px/1 var(--f-body);margin-left:6px;vertical-align:1px}
@media (max-width:900px){ .lvw,.acct .acctx{display:none} .acct{padding:3px} .acct.out{padding:6px 14px} .lvbtn{padding:3px} .mebtn{padding:4px 10px 4px 7px} }
/* tablets and phones: the tabs share the width */
@media (max-width:760px){
  .top{gap:10px 10px}
  .tabs button{flex:1 1 0;min-width:0;text-align:center}
}
@media (max-width:640px){
  .brand .mark{width:34px;height:34px} .brand .mark svg{width:26px;height:26px} .wordmark{font-size:19px}
  .corner{gap:6px} .tabs button{padding:9px 4px 11px;font-size:13.5px} .tabs button[aria-selected="true"]::before{left:6px;right:6px}
  .tabs button .lg{display:none} .tabs button .sm{display:inline}
}
@media (max-width:420px){ .wordmark{display:none} }
.sidesw{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:4px}
.sidesw button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px;border-radius:3px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sidesw button:hover{color:var(--ink)}
.sidesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.sw{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;display:block;flex:none}
.sw.w{background:#FFFFFF} .sw.b{background:#1B1F1D}
.sbrow{margin-top:6px} .gside + .gside{margin-top:26px} .gside > .mcol{margin:0 0 10px} .mcol{display:flex;align-items:center;gap:7px;margin:14px 0 4px;font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)} .mside:first-child .mcol{margin-top:0} .mcol.in{margin:0 4px 0 0;align-self:center} .sbsethd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} .seg .sbcol{display:inline-flex;align-items:center;gap:7px;font-weight:750}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:4px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px;border-radius:3px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.35}
.chip.core{background:var(--accent-soft);color:var(--accent)}
.chip.common{background:var(--blu-soft);color:var(--blu)}
.chip.rare{background:var(--surface-2);color:var(--muted)}
.chip.key,.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.best{background:var(--blu-soft);color:var(--blu)}
.chip.mistake{background:var(--oro-soft);color:var(--oro)}
.chip.blunder,.chip.warn,.chip.missed,.chip.trap{background:var(--rosso-soft);color:var(--rosso)}
.chip.mate{background:var(--ink);color:var(--bg)}
.chip.draw{background:var(--surface-2);color:var(--muted)}
.chip.fix,.chip.swap{background:var(--viola-soft);color:var(--viola)}
.chip.new{background:var(--viola-soft);color:var(--viola)}
.chip.game{background:var(--oro-soft);color:var(--oro)}
.chip.win{background:var(--accent-soft);color:var(--accent)}
.chip.loss{background:var(--rosso-soft);color:var(--rosso)}

/* board */
.board{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:4px;overflow:hidden;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.board svg,.thumb svg{display:block;width:100%;height:100%}
/* a move's flair (fxRun): the ring and the sparks where a piece lands, the after-images behind it */
g.fx,.fx-ghost{pointer-events:none} .fx-ring{fill:none;stroke:var(--accent);stroke-width:5} .fx-ring.cap{stroke:var(--oro);stroke-width:7} .fx-spark{fill:var(--oro)} .fx-spark.alt{fill:var(--accent)}
.sq-l{fill:var(--sq-light)} .sq-d{fill:var(--sq-dark)}
.coord{font-family:var(--f-body);font-weight:700;font-size:15px}
.coord.on-l{fill:var(--sq-dark)} .coord.on-d{fill:var(--sq-light)}
.hl{fill:var(--hl)} .selsq{fill:var(--sel)}
.flash-ok{fill:rgba(17,132,63,.45)} .flash-bad{fill:rgba(210,48,42,.45)}
.arr path{fill:none;stroke-linecap:round} .arr{opacity:.82}
.arr.g path{stroke:var(--arr-g)} .arr.g polygon{fill:var(--arr-g)}
.arr.r path{stroke:var(--arr-r)} .arr.r polygon{fill:var(--arr-r)}
.arr.b path{stroke:var(--arr-b)} .arr.b polygon{fill:var(--arr-b)}
.arr.y path{stroke:var(--arr-y)} .arr.y polygon{fill:var(--arr-y)}
.arr.hint{opacity:.55} .board.guided .arr.hint{opacity:.92}
.arr.e path{stroke:var(--arr-e)} .arr.e polygon{fill:var(--arr-e)}
.arr.e1{opacity:.9} .arr.e2{opacity:.55} .arr.e3{opacity:.36} .arr.e.dim{opacity:.16} .arr.e.on{opacity:.95}

/* map */

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin-bottom:10px}

/* study + drill */
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:16px}

.crumbs .btn{flex:none}
.crumbs .spacer{display:none}
.sgrid{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:32px;align-items:start}

.bcol{position:sticky;top:max(12px,env(safe-area-inset-top,0px));align-self:start}
.controls{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ctl{width:44px;height:40px;border-radius:4px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}

.ctl.play[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.evaltext{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.evaltext b{color:var(--ink);font-weight:600}
.ccol{min-width:0;display:flex;flex-direction:column;gap:16px}
.lhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.08;letter-spacing:.005em;margin:8px 0 6px}
.lhead .sub{color:var(--muted)}
.lhead .why{font-size:13.5px;margin-top:8px;padding:8px 10px;border-radius:3px;background:var(--surface-2);color:var(--ink)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
.mcard .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.side{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:3px}
.side.you{background:var(--ink);color:var(--bg)}
.side.blk{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.mcard .stepno{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mcard h3{font-size:21px;line-height:1.25;font-weight:650;display:flex;align-items:center;gap:10px}
.mcard h3 .pico{width:30px;height:30px;flex:none}
.mcard .note{margin-top:8px;font-size:15px;max-width:62ch}
/* what the board says about a move (app/ideas.js): under the note in a lesson, in the drill's feed, beside a mistake */
.mcard .mideas{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)} .mideas .ideak{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.mideas .bul{font-size:14.5px;max-width:62ch}
.feedback .mfeed,.feedback .ofeed,.feedback .pun,.feedback .pwhy{display:block} .feedback .ofeed{margin-top:4px}
.feedback .pun,.feedback .pwhy{margin-top:6px;color:var(--ink)} .feedback .pun::before,.feedback .pwhy::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.feedback .pun::before{background:var(--rosso)} .feedback .pwhy::before{background:var(--accent)}
.gcoach .gidea{display:block;color:var(--muted);font-size:13px;margin-top:1px} .rwhy{font-weight:600} .xlast{font-size:14px;margin:8px 0 0;color:var(--ink)}
.mcard .chips{margin-top:10px}
.mcard.empty h3{font-weight:600;color:var(--muted)}
.opts h4,.linesin h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.optlist{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px;cursor:pointer}
.opt:hover{border-color:var(--accent)}

.opt .pico{width:26px;height:26px}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{display:block;font-size:12.5px;color:var(--muted)}
.opt.warn{border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{position:relative;list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.timeline li{border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .tsep{padding:7px 12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);background:var(--surface-2)}
.trow{display:grid;grid-template-columns:44px 24px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;font-size:14px}
.trow:hover{background:var(--surface-2)}
/* move marks (!, ?!, ?, ??) and the strip of your moves in order */
.mk-key{--mk:var(--mk-key)} .mk-slip{--mk:var(--mk-slip)} .mk-mistake{--mk:var(--mk-mis)} .mk-blunder{--mk:var(--mk-blun)}
.mki{width:19px;height:19px;flex:none;vertical-align:-4px} .mki circle,.mkb circle{fill:var(--mk);stroke:var(--surface);stroke-width:2.2} .mki text,.mkb text{fill:var(--mk-ink);font:800 23px/1 var(--f-display);text-anchor:middle;letter-spacing:0}
.mki.mk-slip text,.mkb.mk-slip text,.mkl.mk-slip text{fill:var(--mk-ink2)} .mkl rect{fill:var(--mk)} .mkl text{fill:var(--mk-ink);font:700 17px/1 var(--f-body)} .mkl{animation:mklfade 3.6s ease forwards;pointer-events:none}
@keyframes mklfade{0%,80%{opacity:1}100%{opacity:0}} .mki text.two,.mkb text.two{font-size:19px;letter-spacing:-.6px} .mkc.in{margin:0 7px 0 0;vertical-align:1px}
.mkc{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap} .mkw{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.mklegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12.5px;color:var(--muted)} .mklegend span{display:inline-flex;align-items:center;gap:5px}
.onum circle{fill:var(--ink);opacity:.86} .onum text{fill:var(--surface);font:700 17px var(--f-mono)}
.onum.odd circle{fill:var(--ord);opacity:1} .onote{display:flex;align-items:center;justify-content:center;gap:7px;margin:8px 0 0;font-size:13px;color:var(--muted)} .onote i{flex:none;width:11px;height:11px;border-radius:50%;background:var(--ord)}
.trow.cur{background:var(--accent-soft)}
.trow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.trow .pico{width:22px;height:22px}
.trow.blk .lbl{color:var(--muted)}
.trow .tg{display:flex;gap:4px}
.trow .tg i{width:8px;height:8px;border-radius:50%;display:block}
.trow.pre:not(.cur) .lbl,.trow.pre:not(.cur) .n{opacity:.62}
.chip.came{background:var(--accent-soft);color:var(--accent)}
.tg .key,.tg .good{background:var(--accent)} .tg .best{background:var(--blu)} .tg .mistake{background:var(--oro)} .tg .blunder,.tg .trap,.tg .warn,.tg .missed{background:var(--rosso)} .tg .mate{background:var(--ink)} .tg .fix,.tg .new,.tg .swap{background:var(--viola)} .tg .game{background:var(--oro)} .tg .draw{background:var(--muted)}
.collapsed{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;font-size:13px;color:var(--muted);background:var(--surface-2);width:100%;border:0;text-align:left;cursor:pointer}
.outcome{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:4px;background:var(--surface-2)}
.outcome b{font-weight:650}
.lesson-actions{display:flex;flex-wrap:wrap;gap:8px}

/* drill */
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}

.status{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}

.feedback{font-size:14.5px;color:var(--muted);min-height:3em}

.feedback b{color:var(--ink)}

.mtable{display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:3px;font-size:13.5px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.mrow:hover{background:var(--surface-2)}
.mch{border-top:1px solid var(--line)} .mcol + .mch{border-top:0}
.mch > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 8px;border-radius:3px;font-size:14.5px}
.mch > summary::-webkit-details-marker{display:none} .mch > summary:hover{background:var(--surface-2)}
.mch > summary b{font-weight:650;display:flex;align-items:center;gap:9px} .mch > summary b::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.mch[open] > summary b::before{transform:rotate(45deg)}
.mch > summary span{font-size:12.5px;color:var(--muted);display:flex;gap:10px;font-family:var(--f-mono)} .mch > summary .due{font-style:normal;color:var(--rosso)}
.mgroup{display:grid;gap:1px;padding:8px 0;border-top:1px solid var(--line)}
.mgroup:first-child{border-top:0;padding-top:0}
.mhead{font-weight:650;font-size:14px;padding:2px 8px 4px}

.mrow .due{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.mrow .due.now{color:var(--rosso)}
.donebox{display:grid;gap:10px;padding:14px;border-radius:4px;background:var(--accent-soft)}
.donebox.bad{background:var(--oro-soft)}

/* Today: the daily five at the top of Drill */
.today{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

.tring{--p:0;flex:none;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--flame) calc(var(--p) * 1%),var(--surface-2) 0)}
.today.done .tring{background:conic-gradient(var(--accent) 100%,var(--surface-2) 0)}
.tring i{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;font-style:normal;line-height:1}
.tring b{font-family:var(--f-display);font-size:28px} .tring small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tmain{display:grid;gap:8px;min-width:0;flex:1 1 120px} .tline{font-size:15px;font-weight:600}
.tside{display:grid;gap:8px;justify-items:end;margin-left:auto}   /* in a narrow column it wraps to a line of its own */
.streak{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)} .streak b{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--ink)}
.flame{width:26px;height:26px;fill:var(--flame);flex:none} .flame .fl-in{fill:var(--flame-2)}
/* the flame takes a new colour as the streak grows (flameTier): 5, 10, 20, 30, 50 and 100 days in a row */
:root[data-flame="1"] .flame{fill:var(--fl1)} :root[data-flame="1"] .flame .fl-in{fill:var(--fl1b)}
:root[data-flame="2"] .flame{fill:var(--fl2)} :root[data-flame="2"] .flame .fl-in{fill:var(--fl2b)}
:root[data-flame="3"] .flame{fill:var(--fl3)} :root[data-flame="3"] .flame .fl-in{fill:var(--fl3b)}
:root[data-flame="4"] .flame{fill:var(--fl4)} :root[data-flame="4"] .flame .fl-in{fill:var(--fl4b)}
:root[data-flame="5"] .flame{fill:var(--fl5)} :root[data-flame="5"] .flame .fl-in{fill:var(--fl5b)}
:root[data-flame="6"] .flame{fill:var(--fl6)} :root[data-flame="6"] .flame .fl-in{fill:var(--fl6b)}
.streak.zero .flame{fill:var(--locked)} .streak.zero .flame .fl-in{fill:var(--locked-2)}
.week{display:flex;gap:5px;margin:0;padding:0;list-style:none}
.week li{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.week i{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.week i svg{width:12px;height:12px}
.week li.on i{background:var(--flame);color:var(--flame-ink)} .week li.now i{box-shadow:0 0 0 2px var(--flame)}
.dmore > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dmore > summary::-webkit-details-marker{display:none}
.xmore{margin-top:10px} .xmore > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;padding:4px 0}
.xmore > summary::-webkit-details-marker{display:none}
.xmore > summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.xmore[open] > summary::before{transform:rotate(45deg) translate(-2px,-2px)}
.dmore > summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.dmore[open] > summary::after{transform:rotate(225deg) translateY(-1px)}
.dmore > summary > span{display:grid;gap:2px} .dmore > summary b{font-size:14.5px} .dmore > summary span span{font-size:13px;color:var(--muted)}
.dmore[open]{display:grid;gap:12px}
@media (max-width:640px){ .sgrid.idle .ccol{order:-1} footer.foot .fcopy{margin-left:0} .tside{margin-left:0;justify-items:start;grid-template-columns:auto auto;justify-content:space-between;align-items:center;width:100%} }

/* Your games: a switch, then one grid */
.ghd{margin-bottom:16px}
.grec{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;color:var(--muted);font-size:15px}
.grec b{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink);margin-right:5px}
.gseg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:5px;margin:0 0 18px;max-width:100%}
.gseg button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:8px 14px;border-radius:4px;font-weight:650;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.gseg button:hover{color:var(--ink)}
.gseg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gseg button span{font-size:12px;font-weight:700;min-width:22px;padding:1px 7px;border-radius:9px;background:var(--surface);color:var(--muted);text-align:center}
.gseg button[aria-selected="true"] span{background:var(--accent-soft);color:var(--accent)}
.gseg i{font-style:normal} .gseg .sm{display:none}
.chapter > .gseg{margin:30px 0 26px}
.otiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.otile{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;min-width:0;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.otile:hover{border-color:var(--accent);transform:translateY(-1px)}
.otx{display:flex;flex-direction:column;gap:5px;min-width:0}
.otx b{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1.05}
.omove{font-size:12.5px;color:var(--muted);line-height:1.35}
.orec{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:4px}
.orec .good{color:var(--accent);font-weight:650} .orec .bad{color:var(--rosso);font-weight:650}
.oknow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.obar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.obar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mshots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mshot{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;padding:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.mshot:hover{border-color:var(--accent)}
.mtx{display:grid;gap:5px;min-width:0}
.mbig{font-family:var(--f-display);font-size:42px;line-height:1;font-weight:700;color:var(--rosso)}
.mbig small{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--muted);margin-left:8px}
.mtx b{font-size:17px;line-height:1.25}
.mpara{color:var(--muted);font-size:13.5px}
.mgo{color:var(--accent);font-weight:650;font-size:13.5px;margin-top:2px}
.grevs{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px}
.grev{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 12px 9px 9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.grev:hover{border-color:var(--accent)}
.gtx{display:grid;gap:3px;min-width:0}
.gtop{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.gtx b{font-size:16px;line-height:1.25}
.gmeta{font-size:12.5px;color:var(--muted)}
.ggo{color:var(--muted)} .ggo svg{width:18px;height:18px;display:block} .grev:hover .ggo{color:var(--accent)}
.nw{white-space:nowrap}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sechead h2{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:.005em}
.sechead p{color:var(--muted);max-width:60ch}

/* an opening at a glance (it was the cheat sheet) */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;display:grid;gap:8px}
.ccard:hover{border-color:var(--accent)}
.ccard .if{font-size:12px;color:var(--muted);line-height:1.35}
.ccard .then{font-size:14.5px;font-weight:650;line-height:1.3}
.ccard .then::before{content:"→ ";color:var(--accent)}

.chapter{scroll-margin-top:16px}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 14px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.facts li b{font-weight:650}
.facts li span{color:var(--muted);font-size:14px}

/* odds + sandbox */
.odds{display:grid;gap:6px}
.orow{display:grid;grid-template-columns:24px minmax(0,1fr) 92px 38px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.orow .pico{width:22px;height:22px}
.orow .ol{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .ob{height:8px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.orow .ob i{display:block;height:100%;background:var(--line)}
.orow.pick{color:var(--ink);font-weight:650}
.orow.pick .ob i{background:var(--accent)}
.orow .op{font-family:var(--f-mono);font-size:12px;text-align:right}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:300px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:40px 24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.feed .pico{width:22px;height:22px}
.feed li.blk .fl{color:var(--muted)}
.feed .fq{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.feed li.slip{background:var(--rosso-soft)}
.feed li.last{background:var(--accent-soft)}
.feed li.pre{opacity:.6}
.feed.sbjump li{display:block;padding:0} .feed.sbjump button{display:grid;grid-template-columns:40px 24px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:7px 12px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.feed.sbjump button:hover{background:var(--surface-2)} .feed.sbjump button.last{background:var(--accent-soft)} .feed.sbjump button.fut{opacity:.5}
.feed.sbjump button.blk .fl{color:var(--muted)}
.sbks .sbk .tnum{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)} .sbkeys{margin-top:6px;text-align:center} .sbhow{margin:0}
@media (hover:none){ .sbkeys{display:none} }
.sbks{display:flex;flex-wrap:wrap;gap:6px}
.sbks .sbk{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px}
.sbks .sbk:hover{border-color:var(--accent)} .sbks .sbk svg{width:18px;height:18px}
.sbwhere{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px} .sbwhere .lesson-actions{margin:0;justify-content:center}
.sbsetbtn{display:inline-flex;align-items:center;gap:7px} .sbsetbtn svg{width:15px;height:15px;flex:none}
.sbfpos{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;max-width:100%} .sbfpos .thumb{width:42px;flex:none}
.sbfpos b{font-size:14px;min-width:0}
.slips{display:grid;gap:10px}
.slipc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:4px;padding:8px}
.slipc b{display:block;font-size:14.5px}
.slipc p{font-size:13px;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .chip .pico{width:16px;height:16px}
.bigstat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigstat b{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700}
.bigstat span{color:var(--muted);font-size:14px}
.sbintro{display:grid;gap:12px}
.sbintro ol{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* course: a path of units down a rail; the current unit gets a hero card */
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 28px;flex-wrap:wrap;margin:4px 0 20px}
.chead > div:first-child{min-width:0;flex:1 1 420px}
.chead h2{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.015em;line-height:1.05;margin-top:6px}
.chead p{color:var(--muted);max-width:64ch;margin-top:10px}
.cmeter{display:grid;gap:7px;flex:0 1 300px;min-width:0}
.cmeter .bar{display:flex;gap:3px}
.cmeter .bar i{flex:1;height:9px;border-radius:2px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.cmeter .bar i.on{background:var(--accent);box-shadow:none}
.cmeter .bar i.soon{background:none;box-shadow:inset 0 0 0 1px var(--line);opacity:.6}
.cmeter span{font-size:12.5px;color:var(--muted)}
.chero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;box-shadow:var(--shadow);margin-bottom:34px}
.chero h3{font-family:var(--f-display);font-size:clamp(28px,3.4vw,40px);font-weight:700;line-height:1.05;letter-spacing:.005em;margin:10px 0 10px}
.chero .lede{font-size:16px}
.chero.done{grid-template-columns:minmax(0,1fr)}
.ministeps{list-style:none;margin:18px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ministeps li{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.ministeps li.done{background:var(--accent-soft);color:var(--accent)}
.ministeps li.next{background:var(--ink);color:var(--bg)}
.ministeps li svg{width:13px;height:13px}
.path{list-style:none;margin:0;padding:0}
.urow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.urow:first-child .rail::before{top:30px}
.urow:last-child .rail::before{bottom:auto;height:30px}
.ubub{position:relative;z-index:1;width:36px;height:36px;margin-top:12px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.ubub svg{width:16px;height:16px}
.ubub.pass{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ubub.cur{background:var(--surface);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.ubub.soon{border-style:dashed}
.ucard{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px;margin:6px 0;cursor:pointer;transition:border-color .15s,transform .15s}
button.ucard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ucard.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ucard.locked{cursor:default;background:none}
.ucard.locked .thumb{opacity:.45;filter:grayscale(.7)}
.ucard.locked b{color:var(--muted)}
.ucard.soon{cursor:default;background:none;border-style:dashed}
.ut{display:grid;gap:4px;min-width:0}
.ut b{font-size:16px;font-weight:650;line-height:1.25}
.ut .us{font-size:13px;color:var(--muted);line-height:1.4}
.ust{display:grid;justify-items:end;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.sw-w{background:var(--surface-2);color:var(--ink)} .chip.sw-b{background:var(--ink);color:var(--bg)}
.chip.skill{background:var(--viola-soft);color:var(--viola)} .chip.soon{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip .disc{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.chip.sw-w .disc{background:#FFFFFF;border-color:#566960} .chip.sw-b .disc{background:#1B1F1D;border-color:var(--bg)}
.thumb.ph{display:grid;place-items:center} .thumb.ph svg{width:62%;height:62%;opacity:.4}
/* unit page */
.ugrid{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:36px;align-items:start}
.ucol{min-width:0;display:grid;gap:18px}
.uhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.05;letter-spacing:-.015em;margin:10px 0 10px}
.uhead .lede{font-size:16px}
.idea{display:grid;gap:12px}
.ideacap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.ideacap h3{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15}
.ideacap p{color:var(--muted)}
.ideanav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.dots{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)} .dots i.miss{background:var(--rosso)} .dots i.cur{background:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.step.next{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.step .sn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.step.done .sn{background:var(--accent);color:var(--accent-ink)}
.step .sn svg{width:15px;height:15px}
.step h3{font-size:17px;font-weight:650;line-height:1.3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.step h3 .cnt{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.step .sp{font-size:14px;color:var(--muted);margin-top:3px;max-width:64ch}
.step .sx{display:grid;gap:10px;margin-top:12px}
.lrows{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px 6px 6px;cursor:pointer;font-size:14px}
.lrow:hover{border-color:var(--accent)}
.lrow .thumb{border-radius:3px}
.lrow b{display:block;font-weight:600;line-height:1.3}
.lrow .s{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.tick{font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.tick svg{width:13px;height:13px}
.tick.no{color:var(--muted);font-weight:500}
.tick.due{color:var(--rosso)}
.cban{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:4px;background:var(--viola-soft);font-size:13.5px}
/* a course practice game: the unit at the top of the game panel, free play under the board */
.sbcourse{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.sbcourse .kicker{color:var(--accent)} .sbcl{display:flex;align-items:center;gap:8px;margin:4px 0 0;font-weight:600;font-size:14px}
.pdots{display:inline-flex;gap:4px} .pdots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)} .pdots i.on{background:var(--accent);box-shadow:none}
.btn.freeplay{width:100%;justify-content:center;min-height:50px;margin-top:14px;font-size:15px;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface)}
.btn.freeplay:hover{background:var(--accent);color:var(--accent-ink)} .btn.freeplay svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.btn.freeplay circle{fill:var(--surface)} .btn.freeplay:hover circle{fill:var(--accent)}
.cban span{flex:1 1 200px;min-width:0} .cban .cbtns{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px}
.lockednote{padding:12px 14px;border-radius:4px;background:var(--surface-2);color:var(--muted);font-size:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.qhead .evaltext{margin:0}
.ask{font-size:15.5px} .bul.ask{margin:0 0 4px}
.ask b{font-weight:650}

/* accounts (site build): header button, sign-in sheet, toast */
.acct{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px 4px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.acct.out{padding:6px 16px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acct:hover{border-color:var(--accent)}
.acct .av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;position:relative}
.acct .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.acct.ok .av::after{background:var(--accent)} .acct.sync .av::after{background:var(--oro)} .acct.err .av::after{background:var(--rosso)}
.acct .acctx{font-size:13px;color:var(--muted);font-weight:600}
.mebtn{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 12px 4px 8px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:700 15px var(--f-body)}
.lvbtn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:3px 13px 3px 3px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.lvbtn:hover{border-color:var(--accent)}

  const val = sd => 'pnbrq'.split('').reduce((a, k) => a + c[sd][k] * MAT_V[k], 0);
  // rel: what one side has more of than the other (an ending that didn't start from the first move); else what it took
  const took = sd => 'qrbnp'.split('').flatMap(k => Array(Math.max(0, rel ? c[sd][k] - c[sd === 'w' ? 'b' : 'w'][k] : MAT_0[k] - c[sd === 'w' ? 'b' : 'w'][k])).fill(k));
  return {diff: val('w') - val('b'), w: took('w'), b: took('b')};
}
// a piece of the material rows: the drawing cut to its own width (the symbols are 45 wide with room on both sides), 19px high

  if (!el) return;

  const row = (where, sd) => {
    let r = where === 'top' ? host.previousElementSibling : host.nextElementSibling;
    if (!r || !r.classList.contains('mat')){ r = document.createElement('div'); r.className = 'mat ' + where + (host === el ? '' : ' in'); host[where === 'top' ? 'before' : 'after'](r); }
    const lead = sd === 'w' ? m.diff : -m.diff, who = sd === 'w' ? 'White' : 'Black';
    // in an ending: its own extra pieces. Queen first, the same pieces stacked, the lead right after them.
    const white = rel ? sd === 'w' : sd !== 'w', groups = 'qrbnp'.split('').map(k => m[sd].filter(x => x === k)).filter(g => g.length);
    r.innerHTML = groups.map(g => `<span class="mg">${g.map(k => matIcon(k, white)).join('')}</span>`).join('') + (lead > 0 ? `<b class="madv tnum">+${lead}</b>` : '');
    r.setAttribute('aria-label', m[sd].length || lead > 0 ? `${who} has taken ${m[sd].length} ${m[sd].length === 1 ? 'piece' : 'pieces'}${lead > 0 ? ` and is ${lead} ahead` : ''}` : '');

/* ------------------------------------------------------------------ evals */
// Engine numbers are shown the way every chess site shows them: in pawns, plus when White is better, minus when Black is,
// whichever colour you play. The words next to the number ("better for you") are the part that is turned to your side.
const signedPawns = cp => { const a = Math.round(Math.abs(cp) / 10) / 10; return (a === 0 ? '' : cp > 0 ? '+' : '−') + a.toFixed(1); };
const NUMHINT = 'In pawns. Plus: White is better. Minus: Black is better.';
function evalInfo(e){
  if (e === undefined || e === null) return null;
  // engine values are from White's side; the words are turned to your side, the number is not
  const meW = ME === 1;
  if (typeof e === 'string'){
    if (e === '#W') return {pct: 100, txt: meW ? 'Checkmate' : 'White checkmates', num: ''};
    if (e === '#B') return {pct: 0, txt: meW ? 'Black checkmates' : 'Checkmate', num: ''};
    if (e === 'M0') return {pct: 50, txt: 'Game over', num: ''};
    const m = parseInt(e.slice(1), 10), mine = (m > 0) === meW;
    return {pct: m > 0 ? 98 : 2, txt: mine ? `Forced mate for you in ${Math.abs(m)}` : `${OPP} has a forced mate in ${Math.abs(m)}`, num: ''};
  }

  let txt = a < 45 ? 'Equal' : a < 120 ? 'Slightly better for ' : a < 300 ? 'Clearly better for ' : 'Winning for ';

}

/* ------------------------------------------------------------------ progress store */
const PKEY = 'italian-playbook-progress-v1';

  async connect(){

      if (!db || !user) return;

/* ------------------------------------------------------------------ the owner's tools */
// For the claude.ai copy's owner, and on the site for an account marked in Supabase (app_metadata.playbook_owner,
// which only the project can set). Nobody else is shown anything. Switched on, the page works on a copy of the
// progress kept on this device (OKEY) and never written to the account: everything opens, the shop is free, and
// app/product.js adds a panel to finish the course, add levels and so on. Switched off, the real record comes back.
const OKEY = PKEY + ':o';
const Owner = {
  can: false, on: false, art: false, real: null, asked: null, marked: null,
  wanted(){ try { return localStorage.getItem(OKEY + ':on') === '1'; } catch(e){ return false; } },
  async check(){

    let can = this.art;
    if (!can && Cloud.user){ can = flag(Cloud.user);
      if (!can && Cloud.sb && this.asked !== Cloud.user.id){ this.asked = Cloud.user.id;     // the token may predate the mark
        try { const r = await Cloud.sb.auth.getUser(); can = flag(r && r.data && r.data.user); if (can) this.marked = Cloud.user.id; } catch(e){} }
      if (!can && this.marked === Cloud.user.id) can = true; }

  enter(){

/* ------------------------------------------------------------------ the daily five */
// Five different lines played to their end in a day keep the streak alive (the Drill tab serves them, but any finished
// line counts). d.days holds the ids of the lines played on each local date; days older than two months fold to a count.
const DAILY = 5;
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dayDate = (off = 0, from) => { const d = from ? new Date(+from.slice(0, 4), +from.slice(5, 7) - 1, +from.slice(8, 10)) : new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + off); return d; };

const Daily = {
  n(k){ const v = (Prog.d.days || {})[k]; return Array.isArray(v) ? v.length : (v || 0); },
  ids(){ const v = (Prog.d.days || {})[dayKey()]; return Array.isArray(v) ? v : []; },
  count(){ return this.n(dayKey()); },
  done(off = 0){ return this.n(dayKey(off)) >= DAILY; },
  // days in a row with five lines: up to today, or up to yesterday while today is still open
  streak(){ let k = this.done(0) ? 0 : -1, n = 0; while (this.done(k)){ n++; k--; } return n; },
  best(){ const ks = Object.keys(Prog.d.days || {}).filter(k => this.n(k) >= DAILY).sort(); let b = 0, run = 0, prev = null;
    for (const k of ks){ run = prev && dkey(dayDate(1, prev)) === k ? run + 1 : 1; b = Math.max(b, run); prev = k; } return b; },
  mark(id){
    const D = Prog.d.days || (Prog.d.days = {}), k = dayKey(), v = Array.isArray(D[k]) ? D[k] : [];
    if (!v.includes(id)) v.push(id); D[k] = v;
    const old = dayKey(-60); for (const x in D) if (x < old && Array.isArray(D[x])) D[x] = D[x].length;
    return v.length;
  }
};
/* ------------------------------------------------------------------ levels */
// Experience is worked out from the progress, never stored, so every device shows the same level. A line played to its
// end is 10 points without a slip and 4 with one; a lesson studied 5; a practice game 5; a checkpoint passed 40; a day
// with today's five 15. Each level needs 15 more than the one before (45, 60, 75…). Level 5 opens the shop.
// d.lvl only remembers the highest level already celebrated (merged as the larger), so the moment shows once.
const XP = {clean: 10, slip: 4, lesson: 5, game: 5, pass: 40, day: 15};
const Level = {
  xp(d = Prog.d){
    let x = 0;
    for (const r of Object.values(d.lines || {})){ const s = (r.seen || 0) + (r.ps || 0), c = Math.min(s, (r.clean || 0) + (r.pc || 0)); x += c * XP.clean + (s - c) * XP.slip; }

    x += ((d.sb || {}).games || 0) * XP.game;
    for (const k in (d.days || {})){ const v = d.days[k]; if ((Array.isArray(v) ? v.length : v || 0) >= DAILY) x += XP.day; }
    return x + egXP(d) + (d.xpb || 0);
  },
  step: n => 30 + 15 * n,
  of(x = this.xp()){ let n = 1, base = 0; while (x >= base + this.step(n)){ base += this.step(n); n++; } return {n, into: x - base, need: this.step(n), xp: x}; },
  n(){ return this.of().n; }

const SHOP_AT = 5;

// The next line for today's five, from either book: the oldest slips first, then lines whose moves changed, then what is
// due, then new lines from lessons already studied, then new lines in course order. Never one already played today.
const cmpArr = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++){ const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; };

  const today = new Set(Daily.ids()), now = Date.now(), PR = {core: 0, common: 1, rare: 2}, rank = {}, c = [];
  let k = 0; for (const U of COURSE) if (!U.soon && U.lessons) for (const l of U.lessons.concat(U.deeper || [])) if (rank[U.side + l] === undefined) rank[U.side + l] = k++;
  for (const s of ['w', 'b']){
    const B = BOOKS[s], lines = B.lineMap || (B.lineMap = Object.fromEntries(B.lines.map(l => [l.id, l])));
    for (const id of B.drillable){
      if (today.has(id)) continue;
      const l = lines[id], L = LIDX[s][l.lesson]; if (!L) continue;
      const r = Prog.rec(id), cr = rank[s + L.id] === undefined ? 1e4 : rank[s + L.id], pri = PR[L.pri] === undefined ? 1 : PR[L.pri], fresh = [cr, pri, l.main ? 0 : 1];

      else if (!r && lessonSeen(s, L.id)){ tier = 3; key = fresh; }
      else if (!r && cr < 1e4){ tier = 4; key = fresh; }

  return {s: x.s, id: x.id, why: ['You slipped here last time', 'Due for review', 'Due for review', 'New line from a lesson you studied', 'New line', 'Extra practice'][x.tier]};
}

/* ------------------------------------------------------------------ accounts (site build only) */

/* ------------------------------------------------------------------ COURSE */
// One path through both books, ordered by how much each system matters in your games. A lesson unit has five steps
// (idea, learn, drill, practice games, checkpoint); a skill unit has the habit, two practice sets and a checkpoint.
// Passing a unit's checkpoint opens the next one. Progress lives in Prog.d.course and syncs with everything else.
const LIDX = {};
for (const s of ['w', 'b']){ LIDX[s] = {}; BOOKS[s].lessons.forEach(l => LIDX[s][l.id] = l); BOOKS[s].drillSet = new Set(BOOKS[s].drillable); }
// a unit is in the course when its lessons are in the packs in play
const COURSE = DATA_C.units.filter(U => !U.lessons || U.lessons.concat(U.deeper || []).every(l => LIDX[U.side][l])), UNIT = {};
COURSE.forEach((U, k) => { U.k = k; UNIT[U.id] = U; });

// first course is finished (Prog.d.course.grad); the coach then suggests three of them (app/product.js, deepRank).
const DEEP = [], DEEPOF = {};
for (const X of (DATA_C.deep || [])){
  const us = X.parts.map(id => (DATA_C.deepUnits || []).find(u => u.id === id));
  if (!UNIT[X.base] || us.some(U => !U || !U.lessons.every(l => LIDX[U.side][l]))) continue;
  X.units = us; us.forEach((U, k) => { U.k = k; UNIT[U.id] = U; });
  DEEP.push(X); DEEPOF[X.id] = X;
}

  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',

const firstOf = t => Array.isArray(t) ? t.slice(0, 1) : firstSentence(t || '');
const listOf = U => U.deep ? DEEPOF[U.deep].units : COURSE;   // a unit's siblings: the course, or its deep dive's parts

/* idea cards: positions from either book, or a position from your games for the skill unit */
// a deep dive's lesson card takes its words from the lesson, so a personal playbook gets the same scrubbed text

  if (s.avoid) return [`Red: ${lc(s.avoid)}, the move to leave alone.${s.say ? ` Green: ${lc(s.say)}.` : ''}`, why].filter(Boolean).join(' ');
  const said = s.say && lc(sub).replace(/[^a-z ]/g, '').startsWith(lc(s.say).replace(/[^a-z ]/g, ''));

/* the path. Once the course is finished the tab is a library (app/product.js): the finished course, the coach's picks

    const steps = unitSteps(cur), nx = steps.find(s => !s.done), nn = nx && nx.key !== 'idea' ? unitNext(cur) : null;   // the same one step on as the unit page

      if (use){ const ghost = use.cloneNode(); ghost.classList.add('ghost'); ghost.removeAttribute('data-sq'); svg2.appendChild(ghost); use.style.opacity = '.35';
        drag = {sq, ghost, use, svg: svg2, moved: false, x0: e.clientX, y0: e.clientY}; try { el.setPointerCapture(e.pointerId); } catch(_){} }
    } else if (X.sel){ X.sel = null; exBoard(); }
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return; const r = drag.svg.getBoundingClientRect();
    if (!drag.svg.isConnected || !r.width) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) drag.moved = true;
    const x = (e.clientX - r.left) / r.width * 800 - 50, y = (e.clientY - r.top) / r.height * 800 - 50;
    drag.ghost.setAttribute('x', x.toFixed(1)); drag.ghost.setAttribute('y', y.toFixed(1));
  });
  const end = e => {
    if (!drag) return; const d = drag; drag = null;
    const svg = d.svg.isConnected ? d.svg : el.querySelector('svg'), to = svg ? sqAt(svg, e) : null;
    if (d.moved && to && to !== d.sq) exTry(d.sq, to);
    else { d.ghost.remove(); d.use.style.opacity = ''; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { if (drag){ drag.ghost.remove(); drag.use.style.opacity = ''; drag = null; } });
}

/* ------------------------------------------------------------------ boot */
function start(saved){
  Prog.load(); adoptSettings(); Cloud.init(); Product.boot();
  let h = (location.hash || '').slice(1), side = 'w';
  try { const v = localStorage.getItem(SIDE_KEY); if (v && BOOKS[v]) side = v; } catch(e){}
  const hu = h.startsWith('unit.') ? UNIT[h.slice(5)] : null; // course hashes carry no colour: a unit brings its own book
  const hd = h.startsWith('deep.') ? DEEPOF[h.slice(5)] : null;
  if (saved && saved.side && BOOKS[saved.side]) side = saved.side;
  else if (hu){ if (hu.side && hu.kind !== 'skill') side = hu.side; }
  else if (hd) side = hd.side;
  else if (h === 'course' || h === 'course.path' || h === 'grad'){}
  else if (h.startsWith('b.')){ side = 'b'; h = h.slice(2); }
  else if (h) side = 'w';
  loadBook(side); S.chapter = savedChapter(SIDE);
  if (saved && saved.view){
    if (saved.view === 'cheat'){ saved.view = 'learn'; S.lview = 'glance'; }   // the cheat sheet is now part of each opening's page
    if (saved.studyFrom === 'cheat') saved.studyFrom = 'learn';
    Object.assign(S, {view: saved.view === 'quiz' ? 'unit' : saved.view === 'explore' ? (exLoad() ? 'explore' : 'course') : saved.view, unit: saved.unit && UNIT[saved.unit] ? saved.unit : null, slide: saved.slide || 0, line: saved.line && LINES[saved.line] ? saved.line : null, i: saved.i || 0, studyFrom: saved.studyFrom || 'learn', deep: saved.deep && DEEPOF[saved.deep] ? saved.deep : null, coursePath: !!saved.coursePath});
    if (saved.chapter && CHAPTERS[saved.chapter]) S.chapter = saved.chapter;
    if (S.view === 'study' && !S.line) S.view = 'learn';
    if (S.view === 'unit' && !S.unit) S.view = 'course';
  }
  else if (hu){ S.unit = hu.id; S.view = hu.soon ? 'course' : 'unit'; }
  else if (hd){ S.deep = hd.id; S.view = 'course'; }
  else if (h === 'course.path'){ S.coursePath = true; S.view = 'course'; }
  else if (h === 'grad') S.view = gradAt() || baseDone() ? 'grad' : 'course';
  else if (h.startsWith('line.') && LINES[h.slice(5)]){ S.line = h.slice(5); S.i = lineStart(S.line); S.view = 'study'; }
  else if (h.startsWith('learn.') && CHAPTERS[h.slice(6)]){ S.chapter = h.slice(6); S.view = 'learn'; }
  else if (h.startsWith('egunit.') && EG.unit(h.slice(7))){ S.egUnit = h.slice(7); S.view = 'egunit'; }
  else if (h === 'egcourse'){ S.cseg = 'end'; S.view = 'course'; }
  else if (h === 'explore' && exLoad()){ if (S.ex.side && BOOKS[S.ex.side] && S.ex.side !== SIDE){ loadBook(S.ex.side); S.chapter = savedChapter(SIDE); } S.view = 'explore'; }
  else if (VIEWS.includes(h) || h === 'learn') S.view = h;   // #learn: the openings, now under Your games
  else if (h === 'cheat'){ S.view = 'learn'; S.lview = 'glance'; }   // the old cheat sheet: an opening's page, at a glance
  Product.landing(h);
  render();
  Prog.connect(); renderAcct();
  if (typeof Tour !== 'undefined') Tour.boot();
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({side: SIDE, view: S.view, unit: S.unit, slide: S.slide, line: S.line, i: S.i, studyFrom: S.studyFrom, chapter: S.chapter, deep: S.deep, coursePath: S.coursePath})); } catch(e){}
}
try { if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
catch(e){ start({}); }
