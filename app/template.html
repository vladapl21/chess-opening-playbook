<title>Opening Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Header with tabs; Learn = hero + lesson map; Study/Drill = sticky board column beside a coach column; stacks at phone width. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E3E9E2; --ink:#12201A; --muted:#566960; --line:#D0D9D2;
  --accent:#0D6A4E; --accent-ink:#FFFFFF; --accent-soft:#D3EBE0;
  --rosso:#B93628; --rosso-soft:#F6DDD8; --oro:#9C6F0E; --oro-soft:#F4E8C9; --blu:#2D5DAA; --blu-soft:#DCE5F5; --viola:#674C9E; --viola-soft:#E8E1F4;
  --sq-light:#E6ECE2; --sq-dark:#84A390; --hl:rgba(240,201,64,.55); --sel:rgba(13,106,78,.38);
  --arr-g:#11843F; --arr-r:#D2302A; --arr-b:#2F63C9; --arr-y:#E3A90E;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 8px 24px rgba(18,32,26,.08);
  --f-display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --pico-b:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1A; --surface-2:#1C2822; --ink:#E4EDE8; --muted:#97ACA2; --line:#2A3832;
  --accent:#43C08F; --accent-ink:#06231A; --accent-soft:#173A2D;
  --rosso:#F2685B; --rosso-soft:#3D1C18; --oro:#E2B54C; --oro-soft:#3A2F14; --blu:#86AEF2; --blu-soft:#1B2A45; --viola:#B9A2EC; --viola-soft:#2C2342;
  --sq-light:#CFD8CC; --sq-dark:#6F8D7B; --hl:rgba(240,201,64,.5); --sel:rgba(67,192,143,.42);
  --arr-g:#1FA155; --arr-r:#E8463D; --arr-b:#4F82E6; --arr-y:#F0B92A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --pico-b:drop-shadow(0 0 1px rgba(214,226,219,.95)) drop-shadow(0 0 .6px rgba(214,226,219,.95)); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --surface-2:#1C2822; --ink:#E4EDE8; --muted:#97ACA2; --line:#2A3832;
  --accent:#43C08F; --accent-ink:#06231A; --accent-soft:#173A2D;
  --rosso:#F2685B; --rosso-soft:#3D1C18; --oro:#E2B54C; --oro-soft:#3A2F14; --blu:#86AEF2; --blu-soft:#1B2A45; --viola:#B9A2EC; --viola-soft:#2C2342;
  --sq-light:#CFD8CC; --sq-dark:#6F8D7B; --hl:rgba(240,201,64,.5); --sel:rgba(67,192,143,.42);
  --arr-g:#1FA155; --arr-r:#E8463D; --arr-b:#4F82E6; --arr-y:#F0B92A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --pico-b:drop-shadow(0 0 1px rgba(214,226,219,.95)) drop-shadow(0 0 .6px rgba(214,226,219,.95)); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pico.b{filter:var(--pico-b)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .mark{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:30px;height:30px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:-.01em}
.wordmark em{font-style:italic;font-weight:600;color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button .sm{display:none}
.tabs button .badge,.sidesw .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--rosso);color:#fff;font-size:11px;margin-left:6px;padding:0 5px;font-family:var(--f-mono)}
.brandrow{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;min-width:0}
.sidesw{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:11px}
.sidesw button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sidesw button:hover{color:var(--ink)}
.sidesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.sidesw .sw{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;display:block;flex:none}
.sidesw .sw.w{background:#FFFFFF} .sidesw .sw.b{background:#1B1F1D}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.35}
.chip.core{background:var(--accent-soft);color:var(--accent)}
.chip.common{background:var(--blu-soft);color:var(--blu)}
.chip.rare{background:var(--surface-2);color:var(--muted)}
.chip.key,.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.best{background:var(--blu-soft);color:var(--blu)}
.chip.mistake{background:var(--oro-soft);color:var(--oro)}
.chip.blunder,.chip.warn,.chip.missed,.chip.trap{background:var(--rosso-soft);color:var(--rosso)}
.chip.mate{background:var(--ink);color:var(--bg)}
.chip.draw{background:var(--surface-2);color:var(--muted)}
.chip.fix,.chip.swap{background:var(--viola-soft);color:var(--viola)}
.chip.new{background:var(--viola-soft);color:var(--viola)}
.chip.game{background:var(--oro-soft);color:var(--oro)}
.chip.win{background:var(--accent-soft);color:var(--accent)}
.chip.loss{background:var(--rosso-soft);color:var(--rosso)}

/* board */
.board{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.board svg,.thumb svg{display:block;width:100%;height:100%}
.sq-l{fill:var(--sq-light)} .sq-d{fill:var(--sq-dark)}
.coord{font-family:var(--f-body);font-weight:700;font-size:15px}
.coord.on-l{fill:var(--sq-dark)} .coord.on-d{fill:var(--sq-light)}
.hl{fill:var(--hl)} .selsq{fill:var(--sel)}
.flash-ok{fill:rgba(17,132,63,.45)} .flash-bad{fill:rgba(210,48,42,.45)}
.arr path{fill:none;stroke-linecap:round} .arr{opacity:.82}
.arr.g path{stroke:var(--arr-g)} .arr.g polygon{fill:var(--arr-g)}
.arr.r path{stroke:var(--arr-r)} .arr.r polygon{fill:var(--arr-r)}
.arr.b path{stroke:var(--arr-b)} .arr.b polygon{fill:var(--arr-b)}
.arr.y path{stroke:var(--arr-y)} .arr.y polygon{fill:var(--arr-y)}
.arr.hint{opacity:.55}
.ring{fill:none;stroke-width:7}
.ring.g{stroke:var(--arr-g)} .ring.r{stroke:var(--arr-r)} .ring.b{stroke:var(--arr-b)} .ring.y{stroke:var(--arr-y)}
.dot{fill:rgba(18,32,26,.28)} .capring{fill:none;stroke:rgba(18,32,26,.3);stroke-width:8}
.board.input{touch-action:none;cursor:pointer}
.ghost{pointer-events:none}
.board-wrap{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:stretch}
.evalbar{position:relative;border-radius:6px;overflow:hidden;background:#2B312E;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.evalbar .fill{position:absolute;left:0;right:0;bottom:0;background:#F4F1E8;transition:height .35s ease}
.evalbar .mid{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(128,128,128,.6)}
.evalbar.flip{background:#F4F1E8} .evalbar.flip .fill{background:#2B312E}
.thumb{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--surface-2)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:40px;align-items:center;margin-bottom:44px}
.hero-board{position:relative}
.hero-cap{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}
.hero h2{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px}
.hero h2 em{font-style:italic;color:var(--rosso);font-weight:600}
.lede{font-size:17px;color:var(--muted);max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:700}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.stat.alert b{color:var(--rosso)}
.cta{display:flex;flex-wrap:wrap;gap:10px}

/* map */
.part{margin-bottom:40px}
.part-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:end;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.part-head h3{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.part-head p{color:var(--muted);max-width:62ch;grid-column:1}
.part-head .count{grid-row:1/3;grid-column:2;font-size:13px;color:var(--muted);text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.lcard h4{font-size:15.5px;line-height:1.25;margin:6px 0 4px}
.lcard p{font-size:13px;color:var(--muted);line-height:1.4}
.lcard .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.lcard .lwhy{margin-top:8px;color:var(--ink);font-size:13.5px}
.lcard.feat{grid-column:span 2;grid-row:span 2;grid-template-columns:minmax(0,236px) minmax(0,1fr);gap:16px;padding:14px}
.lcard.feat h4,.lcard.wide h4{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;margin:8px 0 6px}
.lcard.wide{grid-column:1/-1;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:14px;max-width:760px}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}
.changes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin-bottom:10px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:6px 0;color:var(--muted)}
.panel li b{color:var(--ink);font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* study + drill */
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.crumbs .where{color:var(--muted);font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .btn{flex:none}
.crumbs .spacer{display:none}
.sgrid{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:32px;align-items:start}
.sgrid.study{grid-template-areas:"board head" "board coach";grid-template-rows:auto 1fr;row-gap:16px}
.sgrid.study .lhead{grid-area:head;min-width:0}
.sgrid.study .bcol{grid-area:board}
.sgrid.study .ccol{grid-area:coach}
.bcol{position:sticky;top:max(12px,env(safe-area-inset-top,0px));align-self:start}
.controls{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ctl{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ctl:hover{background:var(--surface-2)}
.ctl svg{width:18px;height:18px}
.ctl[disabled]{opacity:.35;cursor:default}
.ctl.play[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.evaltext{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.evaltext b{color:var(--ink);font-weight:600}
.ccol{min-width:0;display:flex;flex-direction:column;gap:16px}
.lhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.08;letter-spacing:-.01em;margin:8px 0 6px}
.lhead .sub{color:var(--muted)}
.lhead .why{font-size:13.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
.mcard .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.side{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.side.you{background:var(--ink);color:var(--bg)}
.side.blk{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.mcard .stepno{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mcard h3{font-size:21px;line-height:1.25;font-weight:650;display:flex;align-items:center;gap:10px}
.mcard h3 .pico{width:30px;height:30px;flex:none}
.mcard .note{margin-top:8px;font-size:15px;max-width:62ch}
.mcard .chips{margin-top:10px}
.mcard.empty h3{font-weight:600;color:var(--muted)}
.opts h4,.linesin h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.optlist{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt .pico{width:26px;height:26px}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{display:block;font-size:12.5px;color:var(--muted)}
.opt.warn{border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{position:relative;list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.timeline li{border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.trow{display:grid;grid-template-columns:44px 24px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;font-size:14px}
.trow:hover{background:var(--surface-2)}
.trow.cur{background:var(--accent-soft)}
.trow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.trow .pico{width:22px;height:22px}
.trow.blk .lbl{color:var(--muted)}
.trow .tg{display:flex;gap:4px}
.trow .tg i{width:8px;height:8px;border-radius:50%;display:block}
.tg .key,.tg .good{background:var(--accent)} .tg .best{background:var(--blu)} .tg .mistake{background:var(--oro)} .tg .blunder,.tg .trap,.tg .warn,.tg .missed{background:var(--rosso)} .tg .mate{background:var(--ink)} .tg .fix,.tg .new,.tg .swap{background:var(--viola)} .tg .game{background:var(--oro)} .tg .draw{background:var(--muted)}
.collapsed{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;font-size:13px;color:var(--muted);background:var(--surface-2);width:100%;border:0;text-align:left;cursor:pointer}
.outcome{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.outcome b{font-weight:650}
.lesson-actions{display:flex;flex-wrap:wrap;gap:8px}

/* drill */
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.dpanel h3{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15}
.status{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}
.status .bub{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.status.wait .bub{background:var(--muted)}
.status.bad .bub{background:var(--rosso)}
.feedback{font-size:14.5px;color:var(--muted);min-height:3em}
.sbpend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13.5px}
.sbpend span{flex:1 1 220px;min-width:0}
.feedback b{color:var(--ink)}
.progressbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.queue{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.queue div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.queue b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.queue span{font-size:12px;color:var(--muted)}
.mtable{display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.mrow:hover{background:var(--surface-2)}
.mgroup{display:grid;gap:1px;padding:8px 0;border-top:1px solid var(--line)}
.mgroup:first-child{border-top:0;padding-top:0}

const isMine = nd => nd.w === ME;

function evalInfo(e){
  if (e === undefined || e === null) return null;
  // engine values are from White's side; words and numbers are turned to your side
  const meW = ME === 1;
  if (typeof e === 'string'){
    if (e === '#W') return {pct: 100, txt: meW ? 'Checkmate' : 'White checkmates', num: ''};
    if (e === '#B') return {pct: 0, txt: meW ? 'Black checkmates' : 'Checkmate', num: ''};
    if (e === 'M0') return {pct: 50, txt: 'Game over', num: ''};
    const m = parseInt(e.slice(1), 10), mine = (m > 0) === meW;
    return {pct: m > 0 ? 98 : 2, txt: mine ? `Forced mate for you in ${Math.abs(m)}` : `${OPP} has a forced mate in ${Math.abs(m)}`, num: ''};
  }
  const cp = e, pct = 50 + 50 * (2 / (1 + Math.exp(-cp / 260)) - 1), a = Math.abs(cp), my = meW ? cp : -cp;
  let txt = a < 45 ? 'Equal' : a < 120 ? 'Slightly better for ' : a < 300 ? 'Clearly better for ' : 'Winning for ';
  if (a >= 45) txt += my > 0 ? 'you' : OPP;
  return {pct, txt, num: (my > 0 ? '+' : my < 0 ? '−' : '') + (a / 100).toFixed(1)};
}

const PKEY = 'italian-playbook-progress-v1';
const DAY = 864e5, INTERVALS = [0, 1, 2, 4, 8, 16];
const Prog = {
  d: {lines: {}, puz: {}, updated: 0}, ref: null, saving: false, again: false,
  load(){ try { const raw = localStorage.getItem(PKEY); if (raw){ const v = JSON.parse(raw); if (v && v.lines) this.d = v; } } catch(e){} },
  async connect(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/italian-progress');
      const snap = await this.ref.get();
      if (snap.exists){ const r = snap.data(); if (r && r.lines && (r.updated || 0) > (this.d.updated || 0)){ this.d = JSON.parse(JSON.stringify(r)); this.saveLocal(); refresh(); } }
      else if (this.d.updated) this.push();
    } catch(e){ this.ref = null; }
  },
  saveLocal(){ try { localStorage.setItem(PKEY, JSON.stringify(this.d)); } catch(e){} },
  save(){ this.d.updated = Date.now(); this.saveLocal(); this.push(); },
  async push(){
    if (!this.ref) return;
    if (this.saving){ this.again = true; return; }
    this.saving = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(this.d))); } catch(e){ if (e && e.code !== 'unavailable') this.ref = null; }
    this.saving = false;
    if (this.again){ this.again = false; this.push(); }
  },
  rec(id){ return this.d.lines[id] || null; },
  record(id, clean){
    const r = this.d.lines[id] || {box: 0, seen: 0, clean: 0};
    r.seen++; r.last = Date.now();
    if (clean){ r.clean++; r.box = Math.min(5, (r.box || 0) + 1); } else r.box = 0;
    r.due = Date.now() + INTERVALS[r.box] * DAY - 60e3;
    this.d.lines[id] = r; this.save();
  },
  puz(id, ok){ const r = this.d.puz[id] || {tries: 0, ok: 0}; r.tries++; if (ok) r.ok++; r.last = Date.now(); this.d.puz[id] = r; this.save(); },
  lessonLevel(lid){ const ls = LESSONS[lid].lines.filter(x => DRILLABLE.includes(x)); if (!ls.length) return 0;
    return Math.round(ls.reduce((a, x) => a + Math.min(5, (this.rec(x) || {}).box || 0), 0) / ls.length); },
  dueCount(side){ const now = Date.now(), ids = side ? BOOKS[side].drillable : DRILLABLE; return ids.filter(id => { const r = this.rec(id); return r && r.due <= now; }).length; }
};

function step(d){

}
function jump(k){ const line = LINES[S.line]; if (k === S.i + 1){ step(1); return; } if (k === S.i - 1){ step(-1); return; } S.i = k; renderStudy(); }
function stopPlay(){ if (S.playing){ clearInterval(S.playing); S.playing = null; } }
function togglePlay(){

}
document.addEventListener('keydown', e => {

    else if (e.key === 'ArrowLeft'){ e.preventDefault(); stopPlay(); step(-1); }

function eligibleLines(){
  const f = S.dfilter;
  return DRILLABLE.filter(id => { const L = lessonOf(id); return (f.ch === 'all' || chapterOf(L).id === f.ch) && (f.pri === 'all' || L.pri === f.pri); });
}
function nextSmart(exclude){
  const now = Date.now(), el = eligibleLines().filter(id => id !== exclude);
  const due = el.filter(id => { const r = Prog.rec(id); return r && r.due <= now; }).sort((a, b) => (Prog.rec(a).box - Prog.rec(b).box) || (Prog.rec(a).due - Prog.rec(b).due));
  if (due.length) return {id: due[0], why: 'Due for review'};
  const pr = {core: 0, common: 1, rare: 2};
  const fresh = el.filter(id => !Prog.rec(id)).sort((a, b) => (pr[lessonOf(a).pri] - pr[lessonOf(b).pri]) || (lineReach(b) - lineReach(a)) || (DRILLABLE.indexOf(a) - DRILLABLE.indexOf(b)));
  if (fresh.length) return {id: fresh[0], why: 'New line'};
  const soon = el.slice().sort((a, b) => Prog.rec(a).due - Prog.rec(b).due);
  return soon.length ? {id: soon[0], why: 'Extra practice (nothing due)'} : null;
}

}

  const now = document.getElementById('sbNow'); if (now) now.onclick = () => { sbStart(); renderSbSide(); };
}
function renderSandbox(){
  const D = S.drill;
  view.innerHTML = `<div class="sechead"><h2>Sandbox</h2><p>Play ${MYC} against an opponent who only plays moves from your prep, picked at the odds you'd meet them in real games. One branch, start to finish, then a slip report.</p></div>
  <div class="sgrid">
    <div class="bcol"><div class="board ${D && D.state === 'play' ? 'input' : ''}" id="db">${D ? '' : boardSVG(N[0].f, {coords: true})}</div>
      <div class="legend" style="margin-top:10px"><span><i style="background:var(--arr-g)"></i>your prep move</span><span><i style="background:var(--arr-r)"></i>what you tried</span></div></div>
    <div class="ccol"><div id="sbpanel">${sbPanelHTML()}</div><div id="sbside">${sbSideHTML()}</div></div>
  </div>`;
  if (D) renderDrillBoard();
  wireSbPanel(); wireSbSide(); wireBoardInput();
  const f = document.getElementById('sbfeed'); if (f) f.scrollTop = f.scrollHeight;
  if (D && D.state === 'play' && D.busy){ D.busy = false; const t = ++D.tick; setTimeout(() => { if (S.drill === D && D.tick === t) sbContinue(); }, 250); }
}

/* ------------------------------------------------------------------ GAMES */
function renderGames(){
  const pz = id => DATA.puzzles.findIndex(p => p.game === id);
  const insight = I => {
    let idx, o = {coords: false}, btn;
    if (I.puz !== undefined){ const P = DATA.puzzles[I.puz]; if (!P) return ''; idx = P.node; o.arrows = [P.ok[0] + 'g']; btn = `<button class="btn small primary" data-puz="${I.puz}">Practice the shots</button>`; }
    else { const L = LINES[I.game]; if (!L) return ''; idx = L.n[I.at]; btn = `<button class="btn small primary" data-line="${I.game}" data-i="${I.at}">Replay the game</button>`; }
    const nd = N[idx]; if (nd.u) o.last = [nd.u.slice(0,2), nd.u.slice(2,4)];
    return `<div class="insight">${thumb(idx, o)}<div><div class="big tnum">${esc(I.big)}${I.unit ? `<small>${esc(I.unit)}</small>` : ''}</div><h3>${esc(I.h)}</h3><p>${esc(I.p)}</p><div class="lesson-actions" style="margin-top:10px">${btn}</div></div></div>`; };
  const cards = DATA.games.map(G => {
    const main = LINES[G.lines[0]];
    const tagged = t => G.moments.find(m => (N[main.n[m]].g || []).some(x => t.includes(x)));
    const firstMiss = tagged(['missed']) || tagged(['blunder']) || tagged(['good', 'key']) || G.moments[0];
    const at = Math.max(0, firstMiss - 1), idx = main.n[at];
    const o = nodeBoardOpts(idx, {coords: false}); const better = DATA.lines.find(l => l.lesson === G.id && !l.main && l.at === firstMiss);
    o.arrows = [(better ? N[better.n[at + 1]].u : N[main.n[firstMiss]].u).slice(0, 4) + 'g'];
    const L = LESSONS[G.lesson], C = L ? chapterOf(L) : null;
    return `<article class="gcard">${thumb(idx, o)}<div><div class="chips"><span class="chip ${G.result === 'W' ? 'win' : G.result === 'L' ? 'loss' : ''}">${G.result === 'W' ? 'Win' : G.result === 'L' ? 'Loss' : 'Draw'}</span>${C ? `<span class="chip">${esc(C.name)}</span>` : ''}<span class="chip">${esc(G.date)} · ${esc(G.acct)}</span><span class="chip">vs ${esc(G.opp)} (${G.oppElo})</span></div>
      <h4>${esc(G.title)}</h4><p>${esc(G.summary)}</p><div class="acts"><button class="btn small primary" data-line="${G.id}" data-i="${at}">Replay from the key moment</button><button class="btn small" data-lesson="${G.lesson}">Related lesson</button></div></div></article>`;
  }).join('');
  const st = DATA.stats, maxn = Math.max(...DATA.chapters.map(c => c.stats.n));
  const byOpening = DATA.chapters.map(C => { const s = C.stats, pct = Math.round(s.w / Math.max(1, s.n) * 100);
    return `<button class="orow2" data-ch="${C.id}"><span class="on">${esc(C.name)}</span><span class="ob"><i style="width:${Math.round(s.n / maxn * 100)}%"></i></span><span class="tnum">${s.n}</span><span class="tnum">${s.w}–${s.l}</span><span class="tnum op2 ${pct >= 60 ? 'good' : pct < 50 ? 'bad' : ''}">${pct}%</span></button>`; }).join('');
  view.innerHTML = `<div class="sechead"><h2>Your games</h2><p>${esc(TXT[SIDE].gamesP(st))}</p></div>
    <div class="panel" style="margin-bottom:24px"><h3>By opening</h3><div class="otable"><div class="orow2 head" aria-hidden="true"><span>${esc(TXT[SIDE].byHead)}</span><span>How often</span><span>Games</span><span>Record</span><span style="text-align:right">Won</span></div>${byOpening}</div></div>
    <div class="insights">${(DATA.insights || []).map(insight).join('')}</div>
    <div class="gcards">${cards}</div>`;
  view.querySelectorAll('[data-puz]').forEach(b => b.onclick = () => startPuzzle(+b.dataset.puz));
}

/* ------------------------------------------------------------------ CHEAT SHEET */
function renderCheat(){
  const groups = {};
  for (const c of DATA.cheat){ const L = LESSONS[c.lesson]; (groups[L.part] = groups[L.part] || []).push(c); }
  let html = `<div class="sechead"><h2>Cheat sheet</h2><p>${OPP}'s move is highlighted; the green arrow is your answer. Tap a card to open that position in its lesson.</p></div>
    <div class="seg" style="margin-bottom:22px">${DATA.chapters.map(C => `<button data-jump="${C.id}">${esc(C.name)}</button>`).join('')}</div>`;
  for (const C of DATA.chapters){
    const cs = C.parts.flatMap(p => groups[p] || []); if (!cs.length) continue;
    html += `<section class="part" id="cs-${C.id}" style="scroll-margin-top:16px"><div class="part-head"><div><p class="kicker">${esc(C.move)}</p><h3>${esc(C.name)}</h3></div></div><div class="cgrid">${cs.map(c => {
      const nd = N[c.node], o = {coords: false, arrows: [c.mv.slice(0, 4) + 'g']};
      if (nd.u) o.last = [nd.u.slice(0, 2), nd.u.slice(2, 4)];
      const lid = LESSONS[c.lesson].lines.find(id => LINES[id].n.includes(c.child)) || LESSONS[c.lesson].lines[0];
      const iAt = Math.max(0, LINES[lid].n.indexOf(c.node));
      return `<button class="ccard" data-line="${lid}" data-i="${iAt}">${thumb(c.node, o)}<span class="if">${nd.u ? ((nd.l.startsWith(OPP) ? '' : (isMine(nd) ? 'You: ' : OPP + ': ')) + esc(nd.l)) : 'Start'}</span><span class="then">${esc(c.rule)}</span></button>`; }).join('')}</div></section>`;
  }
  view.innerHTML = html;
  view.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => { const el = document.getElementById('cs-' + b.dataset.jump); if (el) el.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'start'}); });
}

/* ------------------------------------------------------------------ boot */
function start(saved){
  Prog.load();
  let h = (location.hash || '').slice(1), side = 'w';
  try { const v = localStorage.getItem(SIDE_KEY); if (v && BOOKS[v]) side = v; } catch(e){}
  if (saved && saved.side && BOOKS[saved.side]) side = saved.side;
  else if (h.startsWith('b.')){ side = 'b'; h = h.slice(2); }
  else if (h) side = 'w';
  loadBook(side); S.chapter = savedChapter(SIDE);
  if (saved && saved.view){ Object.assign(S, {view: saved.view, line: saved.line && LINES[saved.line] ? saved.line : null, i: saved.i || 0, studyFrom: saved.studyFrom || 'learn'}); if (saved.chapter && CHAPTERS[saved.chapter]) S.chapter = saved.chapter; if (S.view === 'study' && !S.line) S.view = 'learn'; }
  else if (h.startsWith('line.') && LINES[h.slice(5)]){ S.line = h.slice(5); S.i = lineStart(S.line); S.view = 'study'; }
  else if (h.startsWith('learn.') && CHAPTERS[h.slice(6)]){ S.chapter = h.slice(6); S.view = 'learn'; }
  else if (VIEWS.includes(h)) S.view = h;
  render();
  Prog.connect();
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({side: SIDE, view: S.view, line: S.line, i: S.i, studyFrom: S.studyFrom, chapter: S.chapter})); } catch(e){}
}
try { if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
catch(e){ start({}); }
</script>
